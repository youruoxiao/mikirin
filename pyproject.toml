[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mikirin"
version = "0.1.0"
description = "Local-first anime knowledge platform and companion agent"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = []

[project.scripts]
mikirin = "mikirin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mikirin = ["resources/agent/*.md", "resources/benchmarks/*.json"]

[tool.ruff]
target-version = "py312"
line-length = 100

